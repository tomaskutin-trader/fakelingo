<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SL Voice Test</title>
<style>
body{font-family:sans-serif;background:#0d0d15;color:#f0f0f8;padding:20px;line-height:1.5}
button{display:block;width:100%;padding:14px;margin:10px 0;border:none;border-radius:10px;background:#22d3ee;color:#0a0a0f;font-size:16px;font-weight:700}
input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #444;background:#13131f;color:#f0f0f8;font-size:16px}
.box{background:#13131f;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:16px}
.res{font-size:14px;margin-top:8px;white-space:pre-wrap}
.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#facc15}
</style>
</head>
<body>

<div class="box">
  <b>1. Dostupné hlasy (TTS)</b>
  <button onclick="checkVoices()">Zjistit hlasy</button>
  <div id="voiceResult" class="res"></div>
</div>

<div class="box">
  <b>2. Test čtení nahlas (sl-SI)</b>
  <input id="ttsText" value="Živjo, kako si danes?"/>
  <button onclick="speakSlovenian()">Přehrát slovinsky</button>
  <div id="speakResult" class="res"></div>
</div>

<div class="box">
  <b>3. Test rozpoznávání řeči (STT)</b>
  <button onclick="listenSlovenian()">Zkusit mluvit slovinsky</button>
  <div id="listenResult" class="res"></div>
</div>

<script>
function loadVoices(cb){
  var vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (vs.length) { cb(vs); return; }
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = function(){ cb(window.speechSynthesis.getVoices()); };
    setTimeout(function(){ cb(window.speechSynthesis.getVoices()); }, 600);
  } else cb([]);
}

function checkVoices(){
  var out = document.getElementById('voiceResult');
  out.textContent = 'Načítám...';
  loadVoices(function(vs){
    var sl = vs.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('sl') === 0; });
    var txt = 'Celkem hlasů: ' + vs.length + '\n';
    if (sl.length) {
      txt += sl.length + ' slovinských hlasů nalezeno:\n';
      sl.forEach(function(v){ txt += '- ' + v.name + ' (' + v.lang + ')\n'; });
      out.className = 'res ok';
    } else {
      txt += 'Žádný hlas sl / sl-SI nenalezen.';
      out.className = 'res bad';
    }
    out.textContent = txt;
  });
}

function speakSlovenian(){
  var out = document.getElementById('speakResult');
  var text = document.getElementById('ttsText').value.trim();
  if (!window.speechSynthesis) { out.textContent = 'speechSynthesis není dostupný.'; out.className='res bad'; return; }
  window.speechSynthesis.cancel();
  loadVoices(function(vs){
    var v = vs.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('sl') === 0; });
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'sl-SI';
    if (v) { u.voice = v; out.textContent = 'Přehrávám hlasem: ' + v.name; out.className='res ok'; }
    else { out.textContent = 'Žádný sl-SI hlas — použije se fallback.'; out.className='res warn'; }
    u.onerror = function(){ out.textContent = 'Chyba přehrávání.'; out.className='res bad'; };
    window.speechSynthesis.speak(u);
  });
}

function listenSlovenian(){
  var out = document.getElementById('listenResult');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { out.textContent = 'SpeechRecognition není dostupný.'; out.className='res bad'; return; }
  out.textContent = 'Poslouchám... řekni něco slovinsky';
  out.className = 'res warn';
  try {
    var rec = new SR();
    rec.lang = 'sl-SI';
    rec.interimResults = false;
    rec.continuous = false;
    rec.onresult = function(e){
      var t = e.results[0][0].transcript;
      var conf = Math.round(e.results[0][0].confidence * 100);
      out.textContent = 'Rozpoznáno: ' + t + '\nJistota: ' + (isNaN(conf) ? 'neznámá' : conf + '%');
      out.className = 'res ok';
    };
    rec.onerror = function(e){
      out.textContent = 'Chyba: ' + e.error;
      out.className = 'res bad';
    };
    rec.start();
  } catch(err) {
    out.textContent = 'Chyba: ' + err.message;
    out.className = 'res bad';
  }
}
</script>
</body>
</html>
